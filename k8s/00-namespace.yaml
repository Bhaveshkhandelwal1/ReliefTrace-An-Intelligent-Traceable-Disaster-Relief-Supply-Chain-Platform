apiVersion: v1
kind: Namespace
metadata:
  name: disaster-relief
  labels:
    name: disaster-relief
    app.kubernetes.io/part-of: disasterreliefnet
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: drn-resource-quota
  namespace: disaster-relief
spec:
  hard:
    requests.cpu: "16"
    requests.memory: 32Gi
    limits.cpu: "32"
    limits.memory: 64Gi
    pods: "60"
    services: "30"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: drn-limit-range
  namespace: disaster-relief
spec:
  limits:
    - default:
        cpu: "1000m"
        memory: 1Gi
      defaultRequest:
        cpu: "250m"
        memory: 512Mi
      type: Container
