apiVersion: v1
kind: ConfigMap
metadata:
  name: drn-common-config
  namespace: disaster-relief
data:
  SPRING_PROFILES_ACTIVE: "prod,kubernetes"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka-service:9092"
  SPRING_DATA_REDIS_HOST: "redis-service"
  SPRING_DATA_REDIS_PORT: "6379"
  EUREKA_CLIENT_ENABLED: "false"
  KEYCLOAK_ISSUER_URI: "http://keycloak-service:8080/realms/disaster-relief-realm"
  KEYCLOAK_JWK_SET_URI: "http://keycloak-service:8080/realms/disaster-relief-realm/protocol/openid-connect/certs"
  MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: "http://zipkin-service:9411/api/v2/spans"
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus,metrics"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  MANAGEMENT_HEALTH_LIVENESSSTATE_ENABLED: "true"
  MANAGEMENT_HEALTH_READINESSSTATE_ENABLED: "true"
  MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: drn-secrets
  namespace: disaster-relief
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "drn_secure_prod_password_2026!"
  KEYCLOAK_ADMIN: "admin"
  KEYCLOAK_ADMIN_PASSWORD: "drn_keycloak_admin_2026!"
