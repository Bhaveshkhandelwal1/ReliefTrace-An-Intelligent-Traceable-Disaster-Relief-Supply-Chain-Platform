server:
  port: 0

spring:
  application:
    name: matching-service
  datasource:
    url: jdbc:h2:mem:matching_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  cloud:
    openfeign:
      circuitbreaker:
        enabled: false

eureka:
  client:
    enabled: false

outbox:
  publisher:
    enabled: false
