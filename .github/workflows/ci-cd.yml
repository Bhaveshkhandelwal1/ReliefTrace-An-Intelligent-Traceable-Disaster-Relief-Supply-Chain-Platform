name: DisasterReliefNet :: Enterprise CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/disasterreliefnet

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: Build, Unit Tests & JaCoCo Coverage Verification
  # ──────────────────────────────────────────────────────────────────────────
  build-and-test:
    name: Build & Verify (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Eclipse Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Maven Build & Unit Tests
        run: |
          mvn -B clean test -DskipITs --no-transfer-progress

      - name: Verify Code Coverage Thresholds
        run: |
          mvn -B jacoco:check --no-transfer-progress

      - name: Archive Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/*.xml"

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: Code Quality & Static Analysis (SonarQube / Checkstyle)
  # ──────────────────────────────────────────────────────────────────────────
  code-quality:
    name: Code Quality & Style Analysis
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Eclipse Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Architecture Rules & Static Analysis
        run: |
          # Verify ArchUnit architectural rule boundaries
          mvn -B test -Dtest=*ArchitectureTest* --no-transfer-progress

  # ──────────────────────────────────────────────────────────────────────────
  # Job 3: Security Review & OWASP Vulnerability Scanning
  # ──────────────────────────────────────────────────────────────────────────
  security-scan:
    name: OWASP & Container Security Scan
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Eclipse Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: OWASP Dependency-Check Analysis
        run: |
          mvn -B org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=8 \
            -Dformats=HTML,SARIF \
            -DoutputDirectory=target/dependency-check-report \
            -DskipProvided=true \
            --no-transfer-progress || true

      - name: Trivy Vulnerability Scanner (Repo & Configs)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy Scan to GitHub Security Tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  # ──────────────────────────────────────────────────────────────────────────
  # Job 4: Container Build & Push to GHCR (Matrix Strategy)
  # ──────────────────────────────────────────────────────────────────────────
  docker-build-and-push:
    name: Build & Push Docker Images
    needs: [code-quality, security-scan]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        service:
          - discovery-server
          - api-gateway
          - disaster-service
          - donor-service
          - receiver-service
          - inventory-service
          - matching-service
          - transport-service
          - verification-service
          - notification-service
          - finance-service
          - analytics-service

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Eclipse Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Package Service JAR
        run: |
          mvn -B clean package -pl ${{ matrix.service }} -am -DskipTests --no-transfer-progress

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
