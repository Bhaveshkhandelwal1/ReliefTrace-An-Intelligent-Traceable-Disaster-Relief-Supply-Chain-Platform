global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "/etc/prometheus/alert_rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          environment: 'production'
          service: 'prometheus'

  - job_name: 'api-gateway'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['api-gateway:8080', 'host.docker.internal:8080']
        labels:
          environment: 'production'
          service: 'api-gateway'
          tier: 'edge'

  - job_name: 'discovery-server'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['discovery-server:8761', 'host.docker.internal:8761']
        labels:
          environment: 'production'
          service: 'discovery-server'
          tier: 'infra'

  - job_name: 'donor-service'
