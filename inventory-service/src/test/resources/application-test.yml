server:
  port: 0

spring:
  application:
    name: inventory-service
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/disaster-relief
          jwk-set-uri: http://localhost:8180/realms/disaster-relief/protocol/openid-connect/certs
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

eureka:
  client:
    enabled: false
  instance:
    prefer-ip-address: true

inventory:
  low-stock-threshold: 10.0
  reservation-timeout-hours: 24

outbox:
  publisher:
    fixed-delay-ms: 60000
    initial-delay-ms: 60000
    batch-size: 10
